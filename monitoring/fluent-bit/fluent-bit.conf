# Centralized logging pipeline. Collects application logs, container/system
# logs, and (via the ALB/nginx access log input) access logs, then ships
# them to a central sink.
#
# This same config is directly reusable as an ECS "FireLens" sidecar
# (log driver "awsfirelens") to route container stdout/stderr into
# CloudWatch Logs or OpenSearch instead of running it standalone.

[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# --- Application logs (structured JSON written to stdout by app/src/index.js) ---
[INPUT]
    Name              tail
    Tag               app.logs
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Docker_Mode       On
    Refresh_Interval  5

# --- System / host logs ---
[INPUT]
    Name              systemd
    Tag               system.logs
    Systemd_Filter    _SYSTEMD_UNIT=docker.service
    Read_From_Tail    On

# --- Access logs (ALB access logs shipped to S3 in AWS; tailed here for local/dev nginx) ---
[INPUT]
    Name              tail
    Tag               access.logs
    Path              /var/log/nginx/access.log
    Parser            nginx

[FILTER]
    Name    record_modifier
    Match   *
    Record  environment ${ENVIRONMENT:-development}

# --- Output: local stdout sink for the reference stack. ---
# Swap this for the cloudwatch_logs or opensearch plugin in AWS deployments, e.g.:
#
# [OUTPUT]
#     Name              cloudwatch_logs
#     Match             app.*
#     region            us-east-1
#     log_group_name    /devops-project/application
#     log_stream_prefix app-
#     auto_create_group true
[OUTPUT]
    Name    stdout
    Match   *
    Format  json_lines
