name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage
          retention-days: 14

  integration-tests:
    name: Integration Tests (with Postgres)
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: appdb_test
      DB_USERNAME: test_user
      DB_PASSWORD: test_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run integration tests against live Postgres
        run: npm test -- --ci

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: app
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  docker-build-and-scan:
    name: Build Image & Scan for Vulnerabilities
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed on PRs)
        run: docker build -t ci-scan-image:${{ github.sha }} ./app

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ci-scan-image:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          ignore-unfixed: true

  terraform-validate:
    name: Terraform fmt / validate / tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, validate-only)
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

      - name: tfsec (IaC security scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

  notify-on-failure:
    name: Notify on failure
    if: failure()
    needs:
      - lint-and-unit-tests
      - integration-tests
      - dependency-scan
      - docker-build-and-scan
      - terraform-validate
    runs-on: ubuntu-latest
    steps:
      - name: Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "CI failed on `${{ github.repository }}` (${{ github.ref_name }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Email notification
        if: ${{ secrets.NOTIFY_EMAIL != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 'CI failed: ${{ github.repository }}'
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: CI Bot
          body: 'CI failed on ${{ github.ref_name }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
